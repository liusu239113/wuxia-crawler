name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      variant:
        description: Build target
        required: true
        default: release7723
        type: choice
        options:
          - release7723
          - normal
          - both

env:
  BUILD_VARIANT: ${{ github.event.inputs.variant || 'release7723' }}
  VERSION_NAME: "1.0.5"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "::error::Missing RELEASE_STORE_PASSWORD secret"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "::error::Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "::error::Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          mkdir -p release
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release/anlao-release.jks
          printf 'storeFile=release/anlao-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=pkcs12\n' \
            "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > keystore.properties

      - name: Build 7723 Release APK
        if: env.BUILD_VARIANT == 'release7723' || env.BUILD_VARIANT == 'both'
        run: ./gradlew assembleRelease7723Release --no-daemon

      - name: Upload 7723 Release APK
        if: env.BUILD_VARIANT == 'release7723' || env.BUILD_VARIANT == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: wuxia-crawler-7723-release
          path: app/build/outputs/apk/release7723/release/app-release7723-release.apk

      - name: Build Normal Release APK
        if: env.BUILD_VARIANT == 'normal' || env.BUILD_VARIANT == 'both'
        run: ./gradlew assembleNormalRelease --no-daemon

      - name: Upload Normal Release APK
        if: env.BUILD_VARIANT == 'normal' || env.BUILD_VARIANT == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: wuxia-crawler-normal-release
          path: app/build/outputs/apk/normal/release/app-normal-release.apk

      - name: Create 7723 Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.BUILD_VARIANT == 'release7723'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-7723-${{ github.run_number }}
          name: 暗牢江湖行 v${{ env.VERSION_NAME }} 7723 Build ${{ github.run_number }}
          files: app/build/outputs/apk/release7723/release/app-release7723-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Normal Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.BUILD_VARIANT == 'normal'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-normal-${{ github.run_number }}
          name: 暗牢江湖行 v${{ env.VERSION_NAME }} TapTap Build ${{ github.run_number }}
          files: app/build/outputs/apk/normal/release/app-normal-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Combined Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.BUILD_VARIANT == 'both'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ github.run_number }}
          name: 暗牢江湖行 v${{ env.VERSION_NAME }} Build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/release7723/release/app-release7723-release.apk
            app/build/outputs/apk/normal/release/app-normal-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
